name: Docker Publish

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve stable release source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_DRAFT: ${{ github.event.release.draft }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'release' ]]; then
            if [[ "$EVENT_RELEASE_DRAFT" == 'true' || "$EVENT_RELEASE_PRERELEASE" == 'true' ]]; then
              echo 'Stable publish workflow refuses draft/prerelease releases.' >&2
              exit 1
            fi

            RELEASE_TAG="$EVENT_RELEASE_TAG"
            PUBLISH_RELEASE_TAG=true
            VERIFY_TAG="$RELEASE_TAG"
          else
            echo 'Scheduled/manual refresh: resolving latest stable published docker-nginx release.'
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            RELEASE_TAG="$(jq -r '.tag_name // empty' <<<"$release_json")"
            release_draft="$(jq -r '.draft' <<<"$release_json")"
            release_prerelease="$(jq -r '.prerelease' <<<"$release_json")"

            if [[ "$release_draft" != 'false' || "$release_prerelease" != 'false' ]]; then
              echo 'Latest stable release lookup returned a draft/prerelease source.' >&2
              exit 1
            fi

            PUBLISH_RELEASE_TAG=false
            VERIFY_TAG=latest
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'No stable published docker-nginx release found.' >&2
            exit 1
          fi

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "PUBLISH_RELEASE_TAG=$PUBLISH_RELEASE_TAG"
            echo "VERIFY_TAG=$VERIFY_TAG"
          } >> "$GITHUB_ENV"

          {
            echo '## Publish resolution'
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- docker-nginx source release: \`$RELEASE_TAG\`"
            echo "- Publish immutable release tag: \`$PUBLISH_RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact docker-nginx release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Capture source revision
        run: echo "NGINX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Snapshot rolling upstream inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          retry() {
            local attempts="$1"
            shift
            local attempt=1

            until "$@"; do
              if (( attempt >= attempts )); then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi

              echo "Attempt ${attempt} failed; retrying in 5 seconds..." >&2
              sleep 5
              attempt=$((attempt + 1))
            done
          }

          get_nginx_digest() {
            local output digest

            if ! output="$(docker buildx imagetools inspect nginx:alpine 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ -z "$digest" ]]; then
              echo 'nginx:alpine manifest inspection returned no digest.' >&2
              echo "$output" >&2
              return 1
            fi

            printf '%s\n' "$digest"
          }

          get_scriptomatic_sha() {
            local output sha

            if ! output="$(git ls-remote https://github.com/infocyph/Scriptomatic.git refs/heads/main 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            sha="$(printf '%s\n' "$output" | awk 'NF { print $1; exit }')"
            if [[ -z "$sha" ]]; then
              echo 'Scriptomatic main lookup returned no SHA.' >&2
              return 1
            fi

            printf '%s\n' "$sha"
          }

          get_toolset_release() {
            local output

            if ! output="$(gh api repos/infocyph/Toolset/releases/latest --jq '.tag_name // empty' 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            if [[ -z "$output" ]]; then
              echo 'Toolset latest release lookup returned no tag.' >&2
              return 1
            fi

            printf '%s\n' "$output"
          }

          get_installer_sha() {
            local tmp digest
            tmp="$(mktemp)"

            if ! curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              https://github.com/infocyph/Toolset/releases/latest/download/install.sh \
              -o "$tmp"; then
              rm -f "$tmp"
              return 1
            fi

            if [[ ! -s "$tmp" ]]; then
              echo 'Toolset installer download was empty.' >&2
              rm -f "$tmp"
              return 1
            fi

            digest="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"

            if [[ -z "$digest" ]]; then
              echo 'Toolset installer SHA-256 could not be calculated.' >&2
              return 1
            fi

            printf '%s\n' "$digest"
          }

          nginx_alpine_digest="$(retry 5 get_nginx_digest)"
          scriptomatic_main="$(retry 5 get_scriptomatic_sha)"
          toolset_release="$(retry 5 get_toolset_release)"
          toolset_installer_sha256="$(retry 5 get_installer_sha)"

          {
            echo "NGINX_ALPINE_DIGEST=$nginx_alpine_digest"
            echo "SCRIPTOMATIC_MAIN_SHA=$scriptomatic_main"
            echo "TOOLSET_RELEASE=$toolset_release"
            echo "TOOLSET_INSTALLER_SHA256=$toolset_installer_sha256"
          } >> "$GITHUB_ENV"

      - name: Build fresh amd64 release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: infocyph/nginx:publish-candidate
          cache-to: type=gha,scope=publish-candidate-amd64,mode=max,ignore-error=true

      - name: Record candidate upstream resolution
        env:
          IMAGE: infocyph/nginx:publish-candidate
        run: |
          set -euo pipefail

          nginx_version="$(docker run --rm --entrypoint sh "$IMAGE" -ec 'nginx -v 2>&1' | sed 's#^nginx version: nginx/##')"
          alpine_version="$(docker run --rm --entrypoint cat "$IMAGE" /etc/alpine-release)"
          chromacat_version="$(docker run --rm --entrypoint chromacat "$IMAGE" --version | head -n 1)"
          banner_sha256="$(docker run --rm --entrypoint sha256sum "$IMAGE" /usr/local/bin/show-banner | awk '{print $1}')"

          test -n "$nginx_version"
          test -n "$alpine_version"
          test -n "$chromacat_version"
          test -n "$banner_sha256"

          {
            echo "CANDIDATE_NGINX_VERSION=$nginx_version"
            echo "CANDIDATE_ALPINE_VERSION=$alpine_version"
            echo "CANDIDATE_CHROMACAT_VERSION=$chromacat_version"
            echo "CANDIDATE_BANNER_SHA256=$banner_sha256"
          } >> "$GITHUB_ENV"

          {
            echo '## Candidate upstream resolution'
            echo
            echo "- Nginx: \`$nginx_version\`"
            echo "- Alpine: \`$alpine_version\`"
            echo "- chromacat: \`$chromacat_version\`"
            echo "- nginx:alpine index digest: \`$NGINX_ALPINE_DIGEST\`"
            echo "- Toolset latest release: \`$TOOLSET_RELEASE\`"
            echo "- Toolset installer SHA-256: \`$TOOLSET_INSTALLER_SHA256\`"
            echo "- Scriptomatic main: \`$SCRIPTOMATIC_MAIN_SHA\`"
            echo "- Installed banner SHA-256: \`$banner_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final amd64 release-candidate gate
        run: bash tests/release-gate.sh infocyph/nginx:publish-candidate

      - name: Build fresh arm64 release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: infocyph/nginx:publish-candidate-arm64
          cache-to: type=gha,scope=publish-candidate-arm64,mode=max,ignore-error=true

      - name: Final arm64 release-candidate gate
        run: |
          set -euo pipefail
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname infocyph/nginx:publish-candidate-arm64 -m)" = 'aarch64'
          docker run --rm --platform linux/arm64 --entrypoint nginx infocyph/nginx:publish-candidate-arm64 -v
          docker run --rm --platform linux/arm64 --entrypoint chromacat infocyph/nginx:publish-candidate-arm64 --version
          bash tests/image-smoke.sh infocyph/nginx:publish-candidate-arm64

      - name: Revalidate rolling upstreams before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          retry() {
            local attempts="$1"
            shift
            local attempt=1

            until "$@"; do
              if (( attempt >= attempts )); then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi

              echo "Attempt ${attempt} failed; retrying in 5 seconds..." >&2
              sleep 5
              attempt=$((attempt + 1))
            done
          }

          get_nginx_digest() {
            local output digest

            if ! output="$(docker buildx imagetools inspect nginx:alpine 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ -z "$digest" ]]; then
              echo 'nginx:alpine manifest inspection returned no digest.' >&2
              echo "$output" >&2
              return 1
            fi

            printf '%s\n' "$digest"
          }

          get_scriptomatic_sha() {
            local output sha

            if ! output="$(git ls-remote https://github.com/infocyph/Scriptomatic.git refs/heads/main 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            sha="$(printf '%s\n' "$output" | awk 'NF { print $1; exit }')"
            if [[ -z "$sha" ]]; then
              echo 'Scriptomatic main lookup returned no SHA.' >&2
              return 1
            fi

            printf '%s\n' "$sha"
          }

          get_toolset_release() {
            local output

            if ! output="$(gh api repos/infocyph/Toolset/releases/latest --jq '.tag_name // empty' 2>&1)"; then
              echo "$output" >&2
              return 1
            fi

            if [[ -z "$output" ]]; then
              echo 'Toolset latest release lookup returned no tag.' >&2
              return 1
            fi

            printf '%s\n' "$output"
          }

          get_installer_sha() {
            local tmp digest
            tmp="$(mktemp)"

            if ! curl --fail --silent --show-error --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              https://github.com/infocyph/Toolset/releases/latest/download/install.sh \
              -o "$tmp"; then
              rm -f "$tmp"
              return 1
            fi

            if [[ ! -s "$tmp" ]]; then
              echo 'Toolset installer download was empty.' >&2
              rm -f "$tmp"
              return 1
            fi

            digest="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"

            if [[ -z "$digest" ]]; then
              echo 'Toolset installer SHA-256 could not be calculated.' >&2
              return 1
            fi

            printf '%s\n' "$digest"
          }

          current_nginx_alpine_digest="$(retry 5 get_nginx_digest)"
          current_scriptomatic_main="$(retry 5 get_scriptomatic_sha)"
          current_toolset_release="$(retry 5 get_toolset_release)"
          current_toolset_installer_sha256="$(retry 5 get_installer_sha)"

          if [[ "$current_nginx_alpine_digest" != "$NGINX_ALPINE_DIGEST" ]]; then
            echo "nginx:alpine changed during release: $NGINX_ALPINE_DIGEST -> $current_nginx_alpine_digest" >&2
            exit 1
          fi
          if [[ "$current_scriptomatic_main" != "$SCRIPTOMATIC_MAIN_SHA" ]]; then
            echo "Scriptomatic main changed during release: $SCRIPTOMATIC_MAIN_SHA -> $current_scriptomatic_main" >&2
            exit 1
          fi
          if [[ "$current_toolset_release" != "$TOOLSET_RELEASE" ]]; then
            echo "Toolset latest release changed during release: $TOOLSET_RELEASE -> $current_toolset_release" >&2
            exit 1
          fi
          if [[ "$current_toolset_installer_sha256" != "$TOOLSET_INSTALLER_SHA256" ]]; then
            echo 'Toolset installer content changed during release.' >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Enforce immutable release tags
        if: env.PUBLISH_RELEASE_TAG == 'true'
        env:
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          assert_absent() {
            local image="$1" output

            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "Refusing to overwrite immutable release tag: $image" >&2
              return 1
            fi

            case "$output" in
              *'not found'*|*'manifest unknown'*|*'NAME_UNKNOWN'*) return 0 ;;
              *)
                echo "Could not safely verify release-tag absence for $image:" >&2
                echo "$output" >&2
                return 1
                ;;
            esac
          }

          assert_absent "docker.io/infocyph/nginx:${VERSION_TAG}"
          assert_absent "ghcr.io/infocyph/nginx:${VERSION_TAG}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/infocyph/nginx
            ghcr.io/infocyph/nginx
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.PUBLISH_RELEASE_TAG == 'true' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.NGINX_SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=publish-candidate-amd64
            type=gha,scope=publish-candidate-arm64
          cache-to: type=gha,scope=publish-multiarch,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Generate Docker Hub provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: docker.io/infocyph/nginx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate GHCR provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/infocyph/nginx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifests and runtime
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          resolve_digest() {
            local ref="$1" output digest

            for _ in $(seq 1 12); do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                digest="$(printf '%s\n' "$output" | awk '/^Digest:/ {print $2; exit}')"
                if [[ -n "$digest" ]]; then
                  printf '%s\n' "$digest"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Unable to resolve published digest for $ref" >&2
            [[ -z "${output:-}" ]] || echo "$output" >&2
            return 1
          }

          docker_ref="docker.io/infocyph/nginx:${VERIFY_TAG}"
          ghcr_ref="ghcr.io/infocyph/nginx:${VERIFY_TAG}"
          docker_digest="$(resolve_digest "$docker_ref")"
          ghcr_digest="$(resolve_digest "$ghcr_ref")"

          test "$docker_digest" = "$DIGEST"
          test "$ghcr_digest" = "$DIGEST"

          manifest="$(docker buildx imagetools inspect "$ghcr_ref")"
          printf '%s\n' "$manifest" | grep -Fq 'linux/amd64'
          printf '%s\n' "$manifest" | grep -Fq 'linux/arm64'

          image="ghcr.io/infocyph/nginx@${DIGEST}"
          docker pull --platform linux/amd64 "$image" >/dev/null
          bash tests/image-smoke.sh "$image"

          published_nginx="$(docker run --rm --platform linux/amd64 --entrypoint sh "$image" -ec 'nginx -v 2>&1' | sed 's#^nginx version: nginx/##')"
          published_alpine="$(docker run --rm --platform linux/amd64 --entrypoint cat "$image" /etc/alpine-release)"
          published_chromacat="$(docker run --rm --platform linux/amd64 --entrypoint chromacat "$image" --version | head -n 1)"
          published_banner_sha256="$(docker run --rm --platform linux/amd64 --entrypoint sha256sum "$image" /usr/local/bin/show-banner | awk '{print $1}')"

          test "$published_nginx" = "$CANDIDATE_NGINX_VERSION"
          test "$published_alpine" = "$CANDIDATE_ALPINE_VERSION"
          test "$published_chromacat" = "$CANDIDATE_CHROMACAT_VERSION"
          test "$published_banner_sha256" = "$CANDIDATE_BANNER_SHA256"

          {
            echo '## Published Nginx image'
            echo
            echo "- Source tag: \`$RELEASE_TAG\`"
            echo "- Source revision: \`$NGINX_SOURCE_SHA\`"
            echo "- Manifest digest: \`$DIGEST\`"
            echo "- Docker Hub digest: \`$docker_digest\`"
            echo "- GHCR digest: \`$ghcr_digest\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Published amd64 Nginx: \`$published_nginx\`"
            echo "- Published amd64 Alpine: \`$published_alpine\`"
            echo "- Published amd64 chromacat: \`$published_chromacat\`"
            echo "- nginx:alpine index digest at candidate build: \`$NGINX_ALPINE_DIGEST\`"
            echo "- Scriptomatic main at candidate build: \`$SCRIPTOMATIC_MAIN_SHA\`"
            echo "- Toolset release at candidate build: \`$TOOLSET_RELEASE\`"
            echo "- Toolset installer SHA-256: \`$TOOLSET_INSTALLER_SHA256\`"
            echo "- Published amd64 banner SHA-256: \`$published_banner_sha256\`"
            echo "- BuildKit provenance: enabled (\`mode=max\`)"
            echo '- BuildKit SBOM: enabled'
            echo '- GitHub/Sigstore provenance attestations: Docker Hub + GHCR'
          } >> "$GITHUB_STEP_SUMMARY"
